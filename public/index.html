<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Science All Stars — Free peer science tutoring</title>
<meta name="description" content="Science All Stars pairs Liberty High School students with peer tutors for free one-on-one help in Biology, Chemistry, Physics, AP Environmental Science and AP Psychology." />
<meta name="theme-color" content="#0A0A0C" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237FA9F8'/%3E%3Cstop offset='.55' stop-color='%23B98BE8'/%3E%3Cstop offset='1' stop-color='%23F2A0BE'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='10' fill='url(%23g)'/%3E%3Cpath d='M16 7l2.1 5.3L23.5 14l-5.4 1.7L16 21l-2.1-5.3L8.5 14l5.4-1.7z' fill='%23fff'/%3E%3C/svg%3E" />
<script>
  /* Applied before first paint so the page never flashes the wrong theme. */
  (function(){
    try{
      // Dark is the brand default; light is opt-in through the header toggle.
      var saved = localStorage.getItem('sas-theme');
      document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
    }catch(e){ /* private mode — stay on the dark default */ }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="site-header" id="site-header"></header>
<main id="app"><div class="container"><p style="text-align:center;color:var(--text-faint);padding:80px 0;">Loading…</p></div></main>
<footer class="site-footer" id="site-footer"></footer>
<div id="photo-modal" class="modal-overlay hidden">
  <div class="modal">
    <button class="btn btn-ghost btn-small modal-close" data-action="close-modal">Close</button>
    <div id="modal-body"></div>
  </div>
</div>
<div id="toast-wrap" class="toast-wrap"></div>
<script src="/app.js" defer></script>
</body>
</html>
